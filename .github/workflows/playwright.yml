name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Install wait-on (ensure it's available)
      - name: Install wait-on
        run: npm install --save-dev wait-on

      # 6. Start Vite dev server in background (bind to all hosts)
      - name: Start dev server
        run: npm run dev -- --host 0.0.0.0 &

      # 7. Wait for dev server to be ready
      - name: Wait for localhost
        run: npx wait-on http://localhost:5173

      # 8. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test --reporter=list

      # 9. Upload HTML report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
