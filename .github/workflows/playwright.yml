name: Playwright Tests

on:
  push:
    branches: [ main, master, test-playwright-ci ]
  pull_request:
    branches: [ main, master, test-playwright-ci ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Install root dependencies (if any)
      - name: Install root dependencies
        run: npm ci

      # 4. Install frontend dependencies inside client/
      - name: Install client dependencies
        run: cd client && npm ci

      # 5. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. Build the project inside client/
      - name: Build project
        run: cd client && npm run build

      # 7. Start Vite preview server inside client/
      - name: Start preview server
        run: cd client && nohup npm run preview > ../preview.log 2>&1 &

      # 8. Wait for server to be ready
      - name: Wait for preview server
        run: npx wait-on http://127.0.0.1:5173

      # 9. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # 10. Upload HTML report (optional)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 11. Upload preview server log (optional, for debugging)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-log
          path: preview.log
